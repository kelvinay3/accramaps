name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Boot smoke test
        run: |
          npm run seed
          PORT=3999 node server/index.js &
          sleep 2
          curl --fail --silent http://localhost:3999/api/health
          curl --fail --silent "http://localhost:3999/api/places?q=labadi" | grep -q "Labadi"
